name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main
      - dev
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: "0 4 * * 6"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason"
        required: false
        default: "Manual trigger"

jobs:
  Tests:
    runs-on: ubuntu-22.04
    # Python 3.15 is not supported yet: its job may fail without failing the
    # workflow
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
        db-service: [postgresql14]
        search-service: [opensearch2]
        cache-service: [redis]
        mq-service: [rabbitmq]
        include:
          - db-service: postgresql14
            DB_EXTRAS: "postgresql"
          - python-version: "3.15"
            experimental: true

    env:
      DB: ${{ matrix.db-service }}
      SEARCH: ${{ matrix.search-service }}

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt update
          sudo apt-get install ffmpeg
          ffmpeg -version

      - name: Install LDAP dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libsasl2-dev libldap2-dev libssl-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: |
          uv sync --locked
          uv pip list
          docker --version
          docker compose version

      - name: Build project
        run: |
          uv run --locked ./scripts/build-assets

      - name: Run tests
        run: |
          uv run --locked ./run-tests.sh

  tests-e2e:
    # Playwright tests of the React interface (tests/e2e), on a running
    # instance seeded by tests/e2e/setup.sh, with the LTS lines of Node.js
    name: tests-e2e (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    env:
      INVENIO_SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://invenio:invenio@localhost:5432/invenio"
      # No Celery worker: the tasks of new uploads stay in the queue
      INVENIO_BROKER_URL: "redis://localhost:6379/5"
      INVENIO_CELERY_BROKER_URL: "redis://localhost:6379/5"
      INVENIO_IIIF_CACHE_REDIS_URL: "redis://localhost:6379/4"
      INVENIO_SECRET_KEY: "e2e-secret-key"
      E2E_REACT_URL: "https://127.0.0.1:5001"

    steps:
      - name: Install LDAP dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libsasl2-dev libldap2-dev libssl-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      # The runner's Node.js (20) runs Playwright otherwise
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@${{ matrix.node-version }}
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Build project
        run: |
          uv run --locked ./scripts/build-assets

      - name: Start services
        run: |
          uv run --locked docker-services-cli up --db postgresql14 --search opensearch2 --cache redis

      - name: Set up the instance
        run: |
          uv run --locked ./tests/e2e/setup.sh

      - name: Start the server
        env:
          FLASK_DEBUG: "1"
        run: |
          uv run --locked cds run -h 127.0.0.1 -p 5001 --with-threads --no-reload \
            --cert docker/nginx/test.crt --key docker/nginx/test.key > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -skf -o /dev/null "$E2E_REACT_URL/login/" && exit 0
            sleep 2
          done
          cat server.log
          exit 1

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install
          node --version
          npx playwright install --with-deps chromium

      - name: Run end to end tests
        working-directory: tests/e2e
        run: |
          npx playwright test --project=react

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            server.log
          retention-days: 7
