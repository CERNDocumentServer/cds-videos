name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main
      - dev
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: "0 4 * * 6"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason"
        required: false
        default: "Manual trigger"

jobs:
  Tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: [3.9]
        db-service: [postgresql14]
        search-service: [opensearch2]
        cache-service: [redis]
        mq-service: [rabbitmq]
        node-version: [18]
        include:
          - db-service: postgresql14
            DB_EXTRAS: "postgresql"

    env:
      DB: ${{ matrix.db-service }}
      SEARCH: ${{ matrix.search-service }}

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt update
          sudo apt-get install ffmpeg
          ffmpeg -version

      - name: Install LDAP dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libsasl2-dev libldap2-dev libssl-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Use Node.js v18.x
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: |
          uv sync --locked
          uv pip list
          docker --version
          docker compose version

      - name: Build project
        run: |
          uv run --locked ./scripts/build-assets

      - name: Run tests
        run: |
          uv run --locked ./run-tests.sh
